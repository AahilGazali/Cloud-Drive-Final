[build]
  # Base directory for the build (where package.json is located)
  base = "Frontend"
  
  # Build command - install dependencies and build
  # Using npm install instead of npm ci for better compatibility
  command = "npm install && npm run build"
  
  # Directory to publish (where the built files are)
  publish = "build"

# Set Node.js version
[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirects for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
